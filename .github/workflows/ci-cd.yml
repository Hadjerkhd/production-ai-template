name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]

  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ==========================================================
  # SECRET SCANNING
  # Detect leaked tokens, passwords, API keys, certificates
  # ==========================================================
  secret-scan:
    name: 🔐 Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # ==========================================================
  # SAST - STATIC APPLICATION SECURITY TESTING
  # Detect code vulnerabilities and insecure patterns
  # ==========================================================
  sast-semgrep:
    name: 🛡️ SAST Scan (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep Security Rules
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  # ==========================================================
  # DEPENDENCY VULNERABILITY SCAN
  # Detect CVEs in Python packages
  # ==========================================================
  dependency-scan:
    name: 📦 Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Run pip-audit
        run: |
          pip install pip-audit
          uv sync --all-extras --dev
          uv run pip-audit
  # ==========================================================
  # UNIT TESTS 
  # DMake sure all unit tests passes
  # ==========================================================
  unit-tests:
    name: ✅ Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests with coverage
        run: |
          uv run pytest tests/unit \
          --cov=src \
          --cov-report=term \
          --cov-report=xml
      - name: Check minimum coverage
        run: |
          uv run pytest tests/unit \
          --cov=src \
          --cov-fail-under=80

  # ==========================================================
  #
  #
  #===========================================================
  regression-tests:
    name: 🔄 Regression Tests
    runs-on: ubuntu-latest

    needs:
      - unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v2

      - uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - run: uv sync --all-extras --dev

      - name: Run regression suite
        run: uv run pytest tests/regression -v
  # ==========================================================
  # INFRA / DOCKERFILE SECURITY SCAN
  # Scans Dockerfile, Kubernetes manifests, Terraform, etc.
  # ==========================================================
  checkov-scan:
    name: 🏗️ IaC & Docker Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile

  # ==========================================================
  # QUALITY CONTROL
  # Existing code quality checks
  # ==========================================================
  quality-check:
    name: 🔍 Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

  # ==========================================================
  # BUILD IMAGE
  # Runs only if security and quality checks pass
  # ==========================================================
  build-and-push:
    name: 🐳 Build and Push Docker Image

    needs:
      - unit-tests
      - regression-tests
      - secret-scan
      - sast-semgrep
      - dependency-scan
      - checkov-scan
      - quality-check

    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # SBOM GENERATION
  # Creates Software Bill of Materials
  # Useful for audits and supply-chain visibility
  # ==========================================================
  sbom:
    name: 📜 Generate SBOM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "*.spdx.json"

  # ==========================================================
  # CONTAINER VULNERABILITY SCANNING
  # Block pipeline on CRITICAL/HIGH findings
  # ==========================================================
  trivy-scan:
    name: 🚨 Container Vulnerability Scan
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # OPTIONAL:
      # Fail pipeline when High/Critical CVEs exist
      - name: Enforce Vulnerability Threshold
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ==========================================================
  # IMAGE SIGNING
  # Protect against supply chain tampering
  # ==========================================================
  sign-container:
    name: ✍️ Sign Container Image
    needs:
      - build-and-push
      - trivy-scan

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      packages: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image using keyless signing
        run: |
          cosign sign --yes \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image_digest }}

  # ==========================================================
  # OPTIONAL DAST
  # Run against deployed test environment
  # Requires a running URL
  # ==========================================================
  # dast-zap:
  #   name: 🌐 DAST Scan
  #   runs-on: ubuntu-latest
  #
  #   steps:
  #     - name: OWASP ZAP Baseline Scan
  #       uses: zaproxy/action-baseline@v0.12.0
  #       with:
  #         target: https://test-environment.company.com